name: Build

# Compila e roda a verificação (--check) a cada push e pull request. No servidor não há jogo nem MinGW: a
# verificação pula a leitura da GRF e a compilação do módulo, e confere o resto (literais, gerador, exemplos).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build GordoKore.Studio.sln -c Release

      - name: Verificação
        shell: pwsh
        run: |
          & src/GordoKore.Studio/bin/Release/net10.0-windows/GordoKore.Studio.exe --check | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
